name: work / check-models
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        route:
          - glm-5.3-flash-nvidia
          - nemotron-ultra-nvidia
          - nemotron-super-vl-nvidia
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Smoke ${{ matrix.route }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HERMES_IMAGE: ${{ vars.HERMES_IMAGE || 'nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f' }}
        run: python3 scripts/smoke_model.py --route "${{ matrix.route }}"
