name: work / notify
on:
  workflow_run:
    workflows: ["work / agent"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download agent artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: harness-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Resolve core repo
        id: core
        env:
          CORE_REPO: ${{ vars.HARNESS_CORE_REPO || format('{0}/harness-core', github.repository_owner) }}
        run: echo "name=${CORE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Core dispatch token
        id: core-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.core.outputs.name }}
          permission-actions: write

      - name: Dispatch core/publish
        env:
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
          CORE_REPO: ${{ vars.HARNESS_CORE_REPO || format('{0}/harness-core', github.repository_owner) }}
          WORK_REPO: ${{ github.repository }}
          ARTIFACT_DIR: artifact
        run: python scripts/notify.py
